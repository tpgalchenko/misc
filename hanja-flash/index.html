window.RADICALS = null;
(function() {
	function b64ToBytes(b64) {
		const bin = atob(b64);
		const bytes = new Uint8Array(bin.length);
		for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
		return bytes;
	}
	try {
		window.RADICALS = decodeRadicals(b64ToBytes(window.RADICALS_B64));
	} catch(err) {
		console.log("Failed to decode radicals data:", err);
	}
})();
function decodeRadicals(bytes) {
	const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

	let o = 0;
	if(bytes[0]!==0x48 || bytes[1]!==0x4A || bytes[2]!==0x53) throw new Error("bad magic");
	o += 3;
	dv.getUint8(o); o += 1; // version
	const numEntries = dv.getUint16(o, true); o += 2;

	// string table
	const nStrings = dv.getUint16(o, true); o += 2;
	const strings = [];
	for(let i = 0; i < nStrings; i++) {
		const len = dv.getUint16(o, true); o += 2;
		strings.push(new TextDecoder().decode(bytes.subarray(o, o + len)));
		o += len;
	}

	// transform table
	const nTransforms = bytes[o++];
	const transforms = [];
	for(let i = 0; i < nTransforms; i++) {
		const len = dv.getUint16(o, true); o += 2;
		transforms.push(new TextDecoder().decode(bytes.subarray(o, o + len)));
		o += len;
	}

	const DEFAULT_T = "scale(1,-1) translate(0, -871)";

	// decode a bit-packed path
	function decodePath(seg, numBits) {
		let bitPos = 0;
		function readBits(n) {
			let v = 0;
			for(let i = 0; i < n; i++) {
				const bi = bitPos >> 3;
				const bj = 7 - (bitPos & 7);
				v = (v << 1) | ((seg[bi] >> bj) & 1);
				bitPos++;
			}
			return v;
		}
		const CC = ['M','L','Q','C','Z','s'];
		const CN = [2,2,4,6,0,4];
		let d = '';
		while(bitPos < numBits) {
			const type = readBits(3);
			const nargs = CN[type];
			d += CC[type];
			for(let i = 0; i < nargs; i++) {
				d += (i > 0 ? ' ' : '') + ((readBits(12) - 322) / 2);
			}
		}
		return d;
	}

	const radmap = {};
	// entry index occupies numEntries*14 bytes; stroke blob follows it
	const strokeBlobStart = o + numEntries * 14;
	for(let i = 0; i < numEntries; i++) {
		const cp = dv.getUint32(o, true); o += 4;
		const ti = bytes[o++];
		const ns = bytes[o++];
		const rIdx = dv.getUint16(o, true); o += 2;
		const ni = dv.getUint16(o, true); o += 2;
		const so = dv.getUint32(o, true); o += 4;

		const ch = String.fromCodePoint(cp);
		const obj = {};
		if(ns > 0) {
			obj.t = transforms[ti];
			obj.s = [];
		}
		const r = strings[rIdx];
		if(r) obj.r = r;
		const n = strings[ni];
		if(n) obj.n = n;

		if(ns > 0) {
			let p = strokeBlobStart + so;
			for(let s = 0; s < ns; s++) {
				const flag = bytes[p++];
				const plen = dv.getUint16(p, true); p += 2;
				const bitCount = dv.getUint16(p, true); p += 2;
				const data = bytes.subarray(p, p + plen);
				p += plen;
				let d;
				if(flag === 0xFF) {
					d = new TextDecoder().decode(data);
				} else {
					d = decodePath(data, bitCount);
				}
				obj.s.push([d, flag === 1]);
			}
		}
		radmap[ch] = obj;
	}
	return radmap;
}

L35, L36_1, L36_2, L37, L38_1, L38_2, L39_1, L39_2, L40_1, L40_2, L41, L42, L43, L44, L45_1, L45_2, L46, L47, L48, L49, L50, L51, L52, L53_1, L53_2,

function shuffle(array) {
	console.log("Shuffling");
	let currentIndex = array.length;

	while (currentIndex != 0) {
	let randomIndex = Math.floor(Math.random() * currentIndex);
		currentIndex--;

		let tmp = array[currentIndex];
		array[currentIndex] = array[randomIndex];
		array[randomIndex] = tmp;
	}
}

const SVGNS = "http://www.w3.org/2000/svg";
const STROKE_ANIM_DELAY = 500;

function buildHanjaGlyph(ch) {
	const info = window.RADICALS ? window.RADICALS[ch] : null;
	if(!info || !info.s || !info.s.length) return null;

	const svg = document.createElementNS(SVGNS, "svg");
	svg.setAttribute("viewBox", "0 0 1024 1152");
	svg.setAttribute("class", "hanja-glyph");
	svg.setAttribute("data-char", ch);
	svg.style.height = "1em";
	svg.style.width = "0.8889em";

	const g = document.createElementNS(SVGNS, "g");
	g.setAttribute("transform", info.t || "scale(1,-1) translate(0, -871)");
	for(const st of info.s) {
		const path = document.createElementNS(SVGNS, "path");
		path.setAttribute("d", st[0]);
		path.setAttribute("fill", st[1] ? "#0000ee" : "#000000");
		g.appendChild(path);
	}
	svg.appendChild(g);
	return svg;
}

function setHanjaText(el, text) {
	el.replaceChildren();
	for(const ch of text) {
		const glyph = buildHanjaGlyph(ch);
		if(glyph) {
			el.appendChild(glyph);
		} else {
			const span = document.createElement("span");
			span.textContent = ch;
			el.appendChild(span);
		}
	}
}

function renderClickableHanja(el, text) {
	el.replaceChildren();
	const parts = String(text).split("/");
	for(let i = 0; i < parts.length; i++) {
		if(i > 0) {
			const slash = document.createElement("span");
			slash.textContent = "/";
			el.appendChild(slash);
		}
		const part = parts[i];
		const span = document.createElement("span");
		span.textContent = part;
		const info = window.RADICALS ? window.RADICALS[part] : null;
		if(info && info.s && info.s.length) {
			span.style.cursor = "pointer";
			span.onclick = function(ev) {
				ev.stopPropagation();
				openStrokeOverlay(part);
			};
		}
		el.appendChild(span);
	}
}

let strokeAnimTimer = null;

function openStrokeOverlay(ch) {
	const info = window.RADICALS ? window.RADICALS[ch] : null;
	if(!info || !info.s || !info.s.length) return;

	const svg = document.getElementById("stroke-anim-svg");
	svg.replaceChildren();

	const g = document.createElementNS(SVGNS, "g");
	g.setAttribute("transform", info.t || "scale(1,-1) translate(0, -871)");

	const paths = [];
	for(const st of info.s) {
		const path = document.createElementNS(SVGNS, "path");
		path.setAttribute("d", st[0]);
		path.setAttribute("fill", "none");
		path.setAttribute("stroke", "#bbb");
		path.setAttribute("stroke-width", "4");
		g.appendChild(path);
		paths.push({ el: path, radical: st[1] });
	}
	svg.appendChild(g);

	document.getElementById("stroke-overlay").style.display = "flex";

	let i = 0;
	function fillNext() {
		if(i >= paths.length) { strokeAnimTimer = null; return; }
		paths[i].el.setAttribute("fill", paths[i].radical ? "#0000ee" : "#000000");
		paths[i].el.setAttribute("stroke", "none");
		i++;
		strokeAnimTimer = setTimeout(fillNext, STROKE_ANIM_DELAY);
	}
	strokeAnimTimer = setTimeout(fillNext, STROKE_ANIM_DELAY);
}

function closeStrokeOverlay() {
	document.getElementById("stroke-overlay").style.display = "none";
	if(strokeAnimTimer) { clearTimeout(strokeAnimTimer); strokeAnimTimer = null; }
}

let answerCount = 0;
let questionIndex = -1;
let currentCard = null;
let lastCard = [];
let lessons = DATA.slice();
let data = null;
const HISTORY_SIZE = 10;

function showCurrentQuestion() {
	document.getElementById("answer").style.display = 'none';

	const q = document.getElementById("question");
	if(document.getElementById("hanja_mode").checked) {
		setHanjaText(q, currentCard['q']);
		q.className = 'hanja_question';
	} else {
		q.innerText = currentCard['m'];
		q.className = 'keyword_question';
	}

	q.style.display = 'inline';
}

function showNextQuestion() {
	if(currentCard) {
		if(lastCard.push(currentCard) > HISTORY_SIZE) {
			lastCard.splice(0, 1);
		}
	}

	questionIndex += 1;
	if(questionIndex === data.length) {
		if(document.getElementById("shuffle-cb").checked) {
			shuffle(data);
		}
		questionIndex = 0;
		answerCount = 0;
		updateStatus();
	}

	currentCard = data[questionIndex];
	showCurrentQuestion();
}

function showLastQuestion() {
	if(lastCard.length > 0) {
		currentCard = lastCard.pop();
		questionIndex -= 1;
		showCurrentQuestion();
	}
}

function showAnswer() {
	document.getElementById("question").style.display = 'none';

	const aCharEl = document.getElementById("a_char");
	renderClickableHanja(aCharEl, currentCard['q']);

	document.getElementById("a_spell").innerText = "[ " + currentCard['s'] + " ]";
	document.getElementById("a_mean").innerText = currentCard['m'];
	document.getElementById("a_desc").innerHTML = currentCard['d'];
	document.getElementById("a_example").innerText = currentCard['e'];
	document.getElementById("answer").style.display = 'block';

	const lessonEl = document.getElementById("a_lesson");
	lessonEl.innerText = currentCard['lesson'];
	lessonEl.style.cursor = "pointer";
	lessonEl.onclick = function(ev) {
		ev.stopPropagation();
		openLessonDialog();
	};

	document.getElementById("a_ko").innerText = currentCard['k'] ? currentCard['k'] : "";

	answerCount = (answerCount + 1) % data.length;
	updateStatus();
}

function handleClick() {
	if(document.getElementById("question").style.display === 'inline') {
		showAnswer();
	} else {
		showNextQuestion();
	}
}

function updateStatus() {
	document.getElementById("status-text").innerText = "Total: " + data.length + " chars. Answered: " + answerCount + " chars";
}

function toggleLessonsDialog(e) {
	const frame = document.getElementById("dlg-frame");
	frame.classList.toggle("active");
}

function toggleSearchDialog() {
	const list = document.getElementById("search-results");
	list.replaceChildren();

	document.getElementById("search-result-count").innerHTML = "";
	document.getElementById("search-pattern").select();

	const frame = document.getElementById("search-frame");
	frame.classList.toggle("active");
}

function toggleLesson() {
	let checked = 0;
	for(let k = 0; k < DATA.length; ++k) {
		const cb = document.getElementById(DATA[k].name);
		if(cb.checked) checked += 1;
	}

	const l_all = document.getElementById("l_all");
	l_all.checked = checked === DATA.length;
	l_all.indeterminate = checked != DATA.length;
}

function setupLessonsDialog() {
	const ul = document.getElementById("lesson-list");
	while(ul.lastChild.id !== 'li_all') {
		ul.removeChild(ul.lastChild);
	}

	document.getElementById("l_all").checked = true;

	for(let k = 0; k < DATA.length; ++k) {
		const li = document.createElement("div");
		li.classList.add("lesson-li");
		const inp = document.createElement("input");
		inp.type = "checkbox";
		inp.id = DATA[k].name;
		inp.classList.add("lessons-checkbox");
		inp.checked = true;
		inp.addEventListener('change', function() { toggleLesson(inp); }, false);
		li.appendChild(inp);

		const label = document.createElement("label");
		label.for = inp.id;
		label.innerText = inp.id + " (" + DATA[k]["cards"].length + ")";
		label.classList.add("lesson-cb-label");
		label.addEventListener('click', function() { inp.checked = !inp.checked; toggleLesson(inp); }, false);
		li.appendChild(label);
		ul.appendChild(li);
	}
}

function toggleAll(explicit) {
	const l_all = document.getElementById("l_all");

	for(let k = 0; k < DATA.length; ++k) {
		const cb = document.getElementById(DATA[k].name);
		cb.checked =  explicit || l_all.checked;
	}
}

function cancelLessonsDialog(e) {
	toggleLessonsDialog(e);
}

function cancelSearchDialog(e) {
	toggleSearchDialog();
}

function search() {
	const list = document.getElementById("search-results");
	list.replaceChildren();

	const text = document.getElementById("search-pattern").value;
	let results = [];

	for(let k = 0; k < DATA.length; ++k) {
		const lesson = DATA[k];
		for(let q = 0; q < lesson.cards.length; ++q) {
			if(lesson.cards[q]['q'].indexOf(text) != -1) {
				results.push({ 'lesson' : k, 'card' : q, 'type' : 'q' });
			}
			else if(lesson.cards[q]['m'].indexOf(text) != -1) {
				results.push({ 'lesson' : k, 'card' : q, 'type' : 'm' });
			}
			else if(lesson.cards[q]['d'].indexOf(text) != -1) {
				results.push({ 'lesson' : k, 'card' : q, 'type' : 'd' });
			}
			else if(lesson.cards[q]['e'].indexOf(text) != -1) {
				results.push({ 'lesson' : k, 'card' : q, 'type' : 'e' });
			}
		}
	}
	document.getElementById("search-result-count").innerHTML = "Records found: " + results.length;

	for(const e of results) {
		const lesson = DATA[e['lesson']];
		const card = lesson.cards[e['card']];
		const item = document.createElement("div");
		item.classList.add('search-item');
		item.innerHTML = "<a href='#' onclick='openSearchCard(" + e['lesson'] +"," + e['card'] + ")'>"
			+ lesson['name']
			+ "<span class='a_char'>" + card['q'] + "</span> <span class='a_spell'>" + card['s'] + "</span> "
			+ "<span class='a_mean'>" + card['m'] + "</span> <span class='a_ko'>" + (card['k'] ? card['k'] : "") + "</span>"
			+ "</a>";
			list.appendChild(item);
	}
}

function openSearchCard(lessonIdx, cardIdx) {
	currentCard = DATA[lessonIdx]['cards'][cardIdx];
	showAnswer();
	toggleSearchDialog();
}

function openLessonDialog() {
	const list = document.getElementById("lesson-chars");
	list.replaceChildren();

	const lessonName = currentCard['lesson'];
	const lessonIdx = currentCard['lessonIdx'];
	const lesson = DATA[lessonIdx];

	document.getElementById("lesson-dialog-title").innerText = lesson.name + " (" + lesson.cards.length + " chars)";

	for(let i = 0; i < lesson.cards.length; i++) {
		const card = lesson.cards[i];
		const item = document.createElement("a");
		item.href = "#";
		item.onclick = (function(idx) {
			return function(ev) {
				ev.preventDefault();
				openLessonCard(lessonIdx, idx);
			};
		})(i);
		item.innerHTML =
			"<span class='lesson-char-hanja'>" + card['q'] + "</span>" +
			"<span class='lesson-char-spell'>" + card['s'] + "</span> " +
			"<span class='lesson-char-mean'>" + card['m'] + "</span>";
		list.appendChild(item);
	}

	document.getElementById("lesson-dialog-frame").classList.add("active");
}

function openLessonCard(lessonIdx, cardIdx) {
	currentCard = DATA[lessonIdx]['cards'][cardIdx];
	closeLessonDialog();
	showAnswer();
}

function closeLessonDialog() {
	document.getElementById("lesson-dialog-frame").classList.remove("active");
}

function indexLessons(do_shuffle) {
	data = []
	for(let k = 0; k < lessons.length; ++k) {
		data.push(... lessons[k].cards);
	}
	if(do_shuffle) {
		shuffle(data);
	}
	answerCount = 0;
}

function pasteSearchPattern() {
	navigator.clipboard.readText().then(text => {
		if(text) {
			document.getElementById("search-pattern").value = text;
			search();
		}
	})
	.catch(err => console.log(err));
}

function okLessonsDialog(e) {
	let checked = 0;
	const do_shuffle = document.getElementById("shuffle-cb").checked;

	for(let k = 0; k < DATA.length; ++k) {
		const cb = document.getElementById(DATA[k].name);
		if(cb.checked) checked += 1;
	}
	if(checked === 0) {
		return;
	}

	toggleLessonsDialog(e);
	lessons = []
	for(let k = 0; k < DATA.length; ++k) {
		const cb = document.getElementById(DATA[k].name);
		if(cb.checked) {
			lessons.push(DATA[k]);
		}
	}
	indexLessons(do_shuffle);
	updateStatus();
	questionIndex = data.length - 1;
	showNextQuestion()
}

function onLoad() {
	for(let k = 0; k < DATA.length; ++k) {
		for(let q = 0; q < DATA[k]["cards"].length; ++q) {
			DATA[k]["cards"][q]["lesson"] = DATA[k]["name"];
			DATA[k]["cards"][q]["lessonIdx"] = k;
			DATA[k]["cards"][q]["cardIdx"] = q;
		}
	}
	indexLessons(false);
	setupLessonsDialog();
	updateStatus();
	showNextQuestion();
	window.addEventListener("keypress", (ev) => {
		if(ev.key === " ") {
			if(document.getElementById("stroke-overlay").style.display === "flex") {
				closeStrokeOverlay();
			} else {
				handleClick();
			}
		}
	});
}

		#toolbar {
			width: 100%;
			height: 10vh;
			display: flex;
			justify-content: center;
			align-items: center;
			column-gap: 2vh;
			vertical-align: middle;
			font-size: 2vh;
		}
		.lessons-checkbox {
			margin-right: 30px;
			margin-left: 10px;
		}
		#hanja_mode, #keyword_mode, #shuffle-cb, .lessons-checkbox, .lesson-cb-label {
			height: 6em;
			vertical-align: middle;
		}
		input[type="button"] {
			font-size: 2vh;
			padding: 20px;
		}
		#a_line1 {
			display: table-cell;
		}
		#status-line {
			font-size: 2vh;
		}
		.dlg-frame {
			display: none;
			position: fixed;
			width: 100vw;
			height: 100vh;
			background: #00000088;
			top: 0;
			border: 1px solid;
		}
		.active {
			display: flex;
			justify-content: center;
			align-items: center;
		}
		#lessons-dlg {
			background: #FFFFFF;
			font-size: 2vh;
			border: 1px solid;
			max-height: 70vh;
			padding: 10px;
			width: 80vw;
			height: 90vh;
			display: flex;
			flex-direction: column;
			align-items: center;
		}
		#lesson-list {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			width: 100%;
			overflow: auto;
		}
		/*
		.lesson-li {
			border: 1px solid;
		}*/
		.lesson-cb-label {
			border: 1px solid;
			border-color: red;
			padding: 1.25em;
		}
		#lessons-dlg-toolbar {
			margin: 10px;
		}
		.search-frame {
			display: none;
			position: fixed;
			width: 100vw;
			height: 30vh;
			background: #00000088;
			top: 0;
			border: 1px solid;
		}
		#search-dlg {
			background: #FFFFFF;
			font-size: 2vh;
			border: 1px solid;
			max-height: 70vh;
			padding: 5px;
			width: 80vw;
			height: 90vh;
			display: flex;
			flex-direction: column;
			align-items: center;
		}
		#search-results{
			width: 100%;
			height: 100%;
			overflow: auto;
			font-size: 4vh;
			padding: 10px;
		}
		#search-pattern {
			width: 10vw;
		}
		#lesson-dialog {
			background: #FFFFFF;
			font-size: 2vh;
			border: 1px solid;
			max-height: 80vh;
			padding: 10px;
			width: 80vw;
			height: 80vh;
			display: flex;
			flex-direction: column;
			align-items: center;
		}
		#lesson-dialog-title {
			font-size: 3vh;
			margin-bottom: 10px;
			padding: 5px;
		}
		#lesson-chars {
			width: 100%;
			overflow: auto;
			flex: 1;
		}
		#lesson-chars a {
			display: block;
			padding: 6px 10px;
			text-decoration: none;
			color: inherit;
			border-bottom: 1px solid #eee;
		}
		#lesson-chars a:hover {
			background: #e8e8e8;
		}
		.lesson-char-hanja {
			display: inline-block;
			font-size: 4vh;
			color: black;
			min-width: 60px;
		}
		.lesson-char-spell {
			color: blue;
		}
		.lesson-char-mean {
			color: black;
		}
		#stroke-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background: rgba(0,0,0,0.7);
			z-index: 1000;
			justify-content: center;
			align-items: center;
			cursor: pointer;
		}
		#stroke-anim-svg {
			width: 70vmin;
			height: 80vmin;
			background: #ffffff;
			border-radius: 8px;
		}
	</style>
</head>
<body onload="onLoad()">
	<div id="toolbar">
		<a href="#" onclick="toggleLessonsDialog(this)" title="Lessons">Lessons</a>
		<a href="#" onclick="showLastQuestion()" title="Show last">&lt;&lt;</a>
		<input type="radio" id="hanja_mode" name="mode" value="hanja" checked/><label for="hanja_mode">Hanja first</label>
		<input type="radio" id="keyword_mode" name="mode" value="keyword" /><label for="keyword_mode">Keyword first</label>
		<a href="#" onclick="showNextQuestion()" title="Show next">&gt;&gt;</a>
		<a href="#" onclick="toggleSearchDialog()" title="Search">Search</a>
	</div>
	<div id="card-container">
		<div id="card" onclick="handleClick()">
			<span id="question" style="display: none">foo</span>
			<div id="answer" style="display: none">
				<div id="a_lesson"></div>
				<div id="a_grid">
					<div id="a_line0">
						<span id="a_char" class="a_char"></span>  <span id="a_spell" class="a_spell"></span>  <span id="a_mean" class="a_mean"></span>  <span id="a_ko" class="a_ko"></span>
					</div>
					<div id="a_line1"><span id="a_desc"></span></div>
					<div id="a_line2"><span id="a_example"></span></div>
				</div>
			</div>
		</div>
	</div>
	<div id="status-line">
		<span id="status-text"></span>
	</div>
	<div id="dlg-frame" class="dlg-frame">
		<div id="lessons-dlg">
			<div id="lesson-list">
				<div id="li_all" class="lesson-li">
					<input type="checkbox" id="l_all" class="lessons-checkbox" onchange="toggleAll(false)"/>
					<label for="l_all" class="lesson-cb-label" onclick="toggleAll(true)">All</label>
				</div>
			</div>
			<div id="lessons-dlg-toolbar">
				<input type="checkbox" id="shuffle-cb" value="shuffle" checked><label for="shuffle-cb">Shuffle</label>
				<input type="button" value="Cancel" onclick="cancelLessonsDialog(this)"/>
				<input type="button" value="OK" onclick="okLessonsDialog(this)"/>
			</div>
		</div>
	</div>
	<div id="search-frame" class="dlg-frame">
		<div id="search-dlg">
			<div>
				<input type="text" id="search-pattern" keydown="search()"/>
				<input type="button" value="Search" onclick="search()"/>
				<input type="button" value="Paste" onclick="pasteSearchPattern()"/>
				<input type="button" value="Cancel" onclick="cancelSearchDialog(this)"/>
			</div>
			<div id="search-result-count"></div>
			<div id="search-results">
			</div>
		</div>
	</div>
	<div id="lesson-dialog-frame" class="dlg-frame" onclick="closeLessonDialog()">
		<div id="lesson-dialog" onclick="event.stopPropagation()">
			<div id="lesson-dialog-title"></div>
			<div id="lesson-chars"></div>
			<div>
				<input type="button" value="Close" onclick="closeLessonDialog()"/>
			</div>
		</div>
	</div>
	<div id="stroke-overlay" onclick="closeStrokeOverlay()">
		<svg id="stroke-anim-svg" viewBox="0 0 1024 1152"></svg>
	</div>
</body>
</html>
